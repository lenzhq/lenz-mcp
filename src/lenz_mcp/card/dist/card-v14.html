<style>
:root {
  color-scheme: light dark;
  --lz-font: var(--font-sans, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif);
  --lz-bg: #FFFFFF;

  --lz-true: #14783A;

  --lz-mixed: #635E59;

     the card. */
  --lz-measure: 640px;
}
:root[data-theme='dark'] {
  --lz-bg: #2A2724;
  --lz-ink: #FFFDF7;
  --lz-meta: #B5AFAA;
  --lz-hair: #3D3935;
  --lz-true: #4ADE80;
  --lz-mostly-true: #FBBF24;
  --lz-mixed: #B5AFAA;
  --lz-mostly-false: #FB923C;
  --lz-false: #FA8C8C;
  --lz-primary: #7BA3F0;
  --lz-on-primary: #1A1816;
  --lz-off: #3D3935;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme]) {
    --lz-bg: #2A2724;
    --lz-ink: #FFFDF7;
    --lz-meta: #B5AFAA;
    --lz-hair: #3D3935;
    --lz-true: #4ADE80;
    --lz-mostly-true: #FBBF24;
    --lz-mixed: #B5AFAA;
    --lz-mostly-false: #FB923C;
    --lz-false: #FA8C8C;
    --lz-primary: #7BA3F0;
    --lz-on-primary: #1A1816;
    --lz-off: #3D3935;
  }
}
/* After both theme blocks, so it outranks their ground. */
:root[data-theme='light'], :root[data-theme='dark'] { --lz-bg: transparent; }
html, body { margin: 0; padding: 0; background: transparent; }
body { font-family: var(--lz-font); color: var(--lz-ink); -webkit-font-smoothing: antialiased; }
* { box-sizing: border-box; }
::selection { background: color-mix(in srgb, var(--lz-primary) 25%, transparent); }

.lz {
  background: var(--lz-bg);
  border: 1px solid var(--lz-hair);
  border-radius: 10px;
  padding: 16px;
  /* Fill the frame the host gives, up to a reading width: a frame wider than the
     card used to leave an empty band on its right and wrap claims that fit. */
  max-width: 880px;

   span the frame, so a landscape phone wider than the card's column does not

/* Zero specificity: the reset must never outrank a component's own margin. */
:where(.lz) :where(h1, h2, p) { margin: 0; }
.lz-eyebrow { font-size: 13px; line-height: 1.4; color: var(--lz-meta); margin: 0 0 8px; }
.lz-claim { font-size: 17px; font-weight: 500; line-height: 1.4; }
.lz-claim:focus { outline: none; }
.lz-verdict { margin-top: 16px; font-size: 30px; font-weight: 500; line-height: 1.1; }
.lz-verdict.dimmed { color: var(--lz-meta); }
.lz-verdict .lz-verdict-label {
  font-size: 13px; font-weight: 400; color: var(--lz-meta); margin-left: 8px; vertical-align: middle;
}
.lz-meta { font-size: 13px; line-height: 1.5; color: var(--lz-meta); }
.lz-conf { margin-top: 6px; }
.lz-no-record { margin-top: 8px; }

.v-true { color: var(--lz-true); }
.v-mostly-true { color: var(--lz-mostly-true); }
.v-mixed { color: var(--lz-mixed); }
.v-mostly-false { color: var(--lz-mostly-false); }
.v-false { color: var(--lz-false); }

.lz-region { margin-top: 16px; padding-top: 12px; border-top: 1px solid var(--lz-hair); }
.lz-region.first { margin-top: 12px; padding-top: 0; border-top: 0; }
.lz-body { font-size: 15px; line-height: 1.6; }
.lz-body, .lz-finding, .lz-quote, .lz-note, .lz-caveats, .lz-conf { max-width: var(--lz-measure); }
.lz-body + .lz-body { margin-top: 10px; }
.lz-clamp { display: -webkit-box; -webkit-line-clamp: 6; -webkit-box-orient: vertical; overflow: hidden; }
.lz-clamp-4 { -webkit-line-clamp: 4; }
.lz-clamp-2 { -webkit-line-clamp: 2; }
/* The reviewers' note: its label sits on the text, closer to it than to the
   confidence line above; the dissent's lead-in names it in medium weight, the
   same ink. */
.lz-reasoning > h2.lz-label { margin: 0 0 4px; }
.lz-lead { font-weight: 500; }
.lz-label { font-size: 13px; font-weight: 500; line-height: 1.4; color: var(--lz-meta); margin: 8px 0 0; }
h2.lz-label { margin: 0 0 10px; }
.lz-rewrite-head { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; margin: 0 0 10px; }
.lz-rewrite-head h2.lz-label { margin: 0; }
.lz-copy-btn { font-size: 13px; padding: 2px 0; min-height: 24px; }

.lz-link {
  appearance: none; background: none; border: 0; padding: 4px 0; margin: 0; cursor: pointer;
  font: inherit; font-size: 15px; color: var(--lz-primary); text-decoration: underline;
  text-underline-offset: 4px; text-align: left; min-height: 24px;
}
a.lz-link { display: inline-block; }
/* A disclosure that closes a list spans its row, so it reads as the list's last line. */
.lz-row-toggle { display: block; width: 100%; margin-top: 8px; min-height: 44px; }
/* Touch: every quiet control keeps a 44px hit area. */
@media (pointer: coarse) { .lz-link { min-height: 44px; } }
.lz [tabindex='-1']:focus { outline: none; }
.lz-actions { margin-top: 16px; }
/* Under the reviewers' note and the pages, the action is its own section: the
   full hairline that separates the card's sections closes the block above, so

.lz-reviewers + .lz-actions { padding-top: 16px; border-top: 1px solid var(--lz-hair); }
.lz-actions-row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; }
.lz-button {
  appearance: none; font: inherit; font-size: 15px; font-weight: 500; cursor: pointer;
  min-height: 44px; padding: 10px 16px; border-radius: 8px; text-align: center; width: 100%;
}
.lz-button.filled { background: var(--lz-primary); color: var(--lz-on-primary); border: 1px solid var(--lz-primary); }
.lz-button.outlined { background: transparent; color: var(--lz-primary); border: 1px solid var(--lz-primary); }
@media (min-width: 420px) { .lz-button { width: auto; } }
.lz :focus-visible { outline: 2px solid var(--lz-primary); outline-offset: 2px; border-radius: 4px; }

.lz-running h2 { font-size: 15px; font-weight: 500; }
.lz-running .lz-meta { margin-top: 6px; font-variant-numeric: tabular-nums; }
/* A sentence is prose: secondary ink at reading size. */
.lz-note { margin-top: 10px; font-size: 14px; line-height: 1.5; color: var(--lz-meta); }
/* A button under a note or an alert keeps the 16px a button in .lz-actions has; alone in its region it sits on the rule. */
.lz-region > * + .lz-button { margin-top: 16px; }

.lz-changed { margin-top: 16px; }
/* The changed line belongs to the stamp below it, not to the claim above. */
.lz-changed + .lz-stamp { margin-top: 4px; }
.lz-stamp { margin-top: 12px; display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 16px; }
.lz-stamp-word { font-size: 34px; font-weight: 500; line-height: 1; }
@media (max-width: 419px) { .lz-stamp-word.two-words { font-size: 28px; } }
.lz-stamp-score { font-size: 20px; font-variant-numeric: tabular-nums; }
.lz-stamp-score .denom { color: var(--lz-meta); }
.lz-bar { display: inline-flex; gap: 3px; flex-basis: 100%; }
.lz-bar i { display: block; width: 14px; height: 7px; background: var(--lz-off); }
.lz-bar i.on { background: currentColor; }
@media (forced-colors: active) { .lz-bar i { border: 1px solid CanvasText; } .lz-bar i.on { background: CanvasText; } }
.lz-finding { margin-top: 14px; font-size: 17px; font-weight: 500; line-height: 1.45; }

.lz-list { list-style: none; margin: 0; padding: 0; }
.lz-list > li + li { margin-top: 8px; padding-top: 8px; border-top: 1px dotted var(--lz-hair); }

   has its own column, so a wrapped line aligns with the

.lz-caveats { list-style: none; }
.lz-caveats > li { display: grid; grid-template-columns: 0.9em 1fr; gap: 0 6px; font-size: 15px; line-height: 1.6; }
.lz-caveats > li::before { content: '•'; color: var(--lz-meta); }
.lz-caveats > li + li { margin-top: 8px; padding-top: 0; border-top: 0; }
/* The disclosure is not a fourth caveat: 8px between items, more below the list. */
.lz-caveats + .lz-link { margin-top: 12px; }
/* The picker's option rows. The checkbox and the number each get a
   column, so a wrapped claim aligns with the claim above it. 44px minimum on a
   coarse pointer is handled by the shared rule below; the label is the target,
   so the whole row is tappable, not just the box. */
.lz-picks > li + li { margin-top: 0; padding-top: 0; border-top: 0; }
.lz-pick { display: grid; grid-template-columns: auto 2ch 1fr; gap: 0 10px; align-items: start;
  min-height: 44px; padding: 10px 0; font-size: 15px; line-height: 1.5; cursor: pointer; }
.lz-pick + .lz-pick { border-top: 1px dotted var(--lz-hair); }
.lz-picks > li + li .lz-pick { border-top: 1px dotted var(--lz-hair); }
.lz-pick input { margin: 2px 0 0; width: 16px; height: 16px; accent-color: var(--lz-primary); }
.lz-pick input:disabled { cursor: not-allowed; }
.lz-pick-n { font-size: 13px; font-variant-numeric: tabular-nums; color: var(--lz-meta); padding-top: 2px; }
.lz-alert { color: var(--lz-false); }
.lz-button:disabled { opacity: 0.55; cursor: not-allowed; }

.lz-source-meta { margin-top: 2px; }
/* The pages the reviewers looked at: a native disclosure, closed by default.
   The summary is a quiet 13px label like the reasoning label, with a 44px hit
   area on touch; the marker is the browser's own. */
.lz-pages-block { margin-top: 12px; }
.lz-pages > summary { cursor: pointer; font-size: 13px; font-weight: 500; line-height: 1.4; color: var(--lz-meta); padding: 6px 0; }
@media (pointer: coarse) { .lz-pages > summary { min-height: 44px; display: flex; align-items: center; } }
.lz-pages-list { margin-top: 6px; }
.lz-pages-list > li { overflow-wrap: anywhere; }
/* A page row is a reference: the title in the card's link blue, underlined
   like every other link, the site under it in secondary ink. No dotted rule
   between rows (the gap groups them). Where the host cannot open links the
   title is plain text in the text ink. */
.lz-pages-list > li + li { margin-top: 4px; padding-top: 0; border-top: 0; }
.lz-page { display: block; padding: 6px 0; color: var(--lz-ink); text-decoration: none; }
.lz-page-title { font-size: 15px; line-height: 1.5; }
a.lz-page .lz-page-title { color: var(--lz-primary); text-decoration: underline; text-underline-offset: 4px; }
.lz-page-site { display: block; margin-top: 2px; font-size: 13px; line-height: 1.4; color: var(--lz-meta); }
@media (pointer: coarse) { .lz-page { min-height: 44px; } }
/* An open list keeps some space under it, before the rule that closes it. */
.lz-pages[open] { padding-bottom: 8px; }
.lz-pages > .lz-link { margin-top: 8px; }
.lz-quote { margin-top: 6px; font-size: 15px; line-height: 1.6; text-indent: 0; }
/* A non-English quote's language, before it: the quote no longer starts the
   line, so its opening mark does not hang. */
.lz-quote-foreign { text-indent: 0; }
.lz-quote-lang { font-size: 12px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--lz-meta); margin-right: 6px; }

   the header's own padding, nothing added. */
.lz-rows > li + li { margin-top: 0; padding-top: 0; }
.lz-rows-region { margin-top: 8px; padding-top: 0; border-top: 0; }

   affordance is on the claim's text, never a box. */
.lz-row-head {
  appearance: none; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 16px;
  align-items: baseline; width: 100%; text-align: left; background: none; border: 0;
  padding: 8px 0; margin: 0; font: inherit; color: inherit; cursor: pointer;
}
.lz-row-head:hover .row-claim { text-decoration: underline; text-underline-offset: 3px; }
.lz-row-head .row-claim { grid-column: 1; }
/* An open row's claim is its title: medium weight, so it reads apart from the text under it. */
.lz-row-head[aria-expanded='true'] .row-claim { font-weight: 500; }

   column rather than push the row past the frame's edge. */
.lz-row-head .row-line { grid-column: 2; grid-row: 1; text-align: right; max-width: 16em; }
.lz-row-head .row-meta { grid-column: 1; }

@media (max-width: 419px) {
  .lz-row-head { grid-template-columns: minmax(0, 1fr); }
  .lz-row-head .row-line { grid-column: 1; grid-row: auto; text-align: left; max-width: none; }
}
.lz-row-head .row-verdict.dimmed { color: var(--lz-meta); }
.lz-row-head .row-score { font-size: 13px; font-variant-numeric: tabular-nums; margin-left: 6px; }
@media (pointer: coarse) { .lz-row-head { min-height: 44px; } }
.lz-row-panel { margin-top: 0; padding-bottom: 8px; }
.lz-row-panel .lz-finding { margin-top: 12px; padding-top: 10px; border-top: 1px solid var(--lz-hair); }
.lz-row-changed { margin-top: -4px; }
.lz-tally { margin-top: 6px; color: var(--lz-meta); }
/* The list card's title and its tally share one line when they fit. */
.lz-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 12px; }
.lz-head .lz-tally { margin-top: 0; }
.lz-rows > li > .num { font-size: 13px; font-variant-numeric: tabular-nums; color: var(--lz-meta); padding-top: 8px; }
.lz-rows > li .row-claim { font-size: 15px; line-height: 1.5; }
.lz-rows > li .row-verdict { font-size: 15px; font-weight: 500; }

.lz-footer {
  margin-top: 12px; padding-top: 8px; border-top: 1px solid var(--lz-hair);
  display: flex; gap: 12px;
  font-size: 13px; color: var(--lz-meta);
}
.lz-sr { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }

/* Claim strip: 24px WCAG target-size wrapper around a 12px ::before square */
.claim-strip {
  display: flex;
  flex-wrap: wrap;
  gap: 0;
  margin: 6px -6px 4px -6px;
  align-items: center;
}
.strip-cell {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 24px;
  height: 24px;
  min-width: 24px;
  min-height: 24px;
  border: 0;
  padding: 0;
  margin: 0;
  cursor: pointer;
  background: transparent;
}
.strip-cell::before {
  content: '';
  display: block;

  background: var(--lz-hair);
}
.strip-cell:hover::before { opacity: 0.85; }
.strip-cell.is-open::before { outline: 2px solid var(--lz-ink); outline-offset: 1px; }
.strip-cell.strip-bad::before { background: var(--lz-false); }
.strip-cell.strip-look::before { background: var(--lz-mostly-true); }
.strip-cell.strip-ok::before { background: var(--lz-true); }
.strip-cell.strip-none::before { background: var(--lz-meta); }

/* Bucket headings and toggles in ListCard */
.lz-rows > li.lz-batch-actions {
  display: block;
  margin: 8px 0 4px;
  padding: 0;
  border-top: 0;
}
.lz-rows > li.lz-batch-actions + li { border-top: 0; }
.lz-rows > li.lz-bucket-head {
  display: block;
  font-size: 13px;
  font-weight: 600;
  letter-spacing: 0.02em;
  color: var(--lz-meta);
  margin-top: 16px;
  margin-bottom: 2px;
  padding-bottom: 5px;
  border-top: 0;
  border-bottom: 1.5px solid var(--lz-hair);
}

.lz-rows > li.lz-bucket-head + li { border-top: 0; }
.lz-bucket-toggle {

  border: 0;
  padding: 0;
  margin: 0;
  width: 100%;
  font: inherit;
  color: inherit;

  display: flex;
  align-items: center;
  justify-content: space-between;

}
@media (pointer: coarse) { .lz-bucket-toggle { min-height: 44px; } }
.lz-bucket-toggle:hover { color: var(--lz-ink); }
.lz-rows > li.citecheck-row { padding: 10px 0; border-bottom: 0; }
.lz-rows > li.citecheck-row > .num { padding-top: 2px; }

/* Mini-trace in DeepResult */
.audit-trace {
  margin-top: 16px;
  padding-top: 12px;
  border-top: 1px solid var(--lz-hair);
}
.audit-trace-summary {
  cursor: pointer;
  font-size: 13px;
  font-weight: 500;
  color: var(--lz-meta);
  padding: 4px 0;

}
.audit-trace-summary:hover { color: var(--lz-ink); }
@media (pointer: coarse) { .audit-trace-summary { min-height: 44px; display: flex; align-items: center; } }
.audit-trace-body {
  margin-top: 8px;
  font-size: 13px;
  line-height: 1.5;
  color: var(--lz-meta);
}
.audit-counts { margin: 0 0 6px 0; }
.audit-panel {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin-top: 8px;
}
.audit-pill {
  display: inline-block;
  font-size: 12px;
  padding: 2px 8px;
  border-radius: 4px;
  background: var(--lz-off);
  border: 1px solid var(--lz-hair);
  color: var(--lz-ink);
}

/* Citation check card */
.citecheck-summary { margin-top: 4px; color: var(--lz-meta); font-size: 14px; }
.citecheck-section { margin-top: 16px; }
.citecheck-section-title,
.citecheck-toggle {
  font-size: 13px;
  font-weight: 600;
  letter-spacing: 0.02em;
  color: var(--lz-meta);
  margin-bottom: 4px;
  border-bottom: 1px solid var(--lz-hair);
  padding-bottom: 4px;
}
.citecheck-list { list-style: none; padding: 0; margin: 0; }
.citecheck-row {
  display: grid;
  grid-template-columns: 2ch minmax(0, 1fr);
  gap: 0 10px;
  padding: 10px 0;
  border-bottom: 1px dotted var(--lz-hair);
}
.citecheck-row:last-child { border-bottom: 0; }
.citecheck-row > .num {
  font-size: 13px;
  font-variant-numeric: tabular-nums;
  color: var(--lz-meta);
  padding-top: 2px;
}
.citecheck-row-body { min-width: 0; }
.citecheck-row-head {
  display: flex;
  align-items: baseline;
  gap: 8px;
  flex-wrap: wrap;
}
.cite-badge {
  display: inline-block;
  font-size: 11px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.04em;
  padding: 2px 6px;
  border-radius: 3px;
  background: var(--lz-off);
  color: var(--lz-ink);
}
.cite-badge.badge-issue {
  background: var(--lz-false);
  color: var(--lz-on-primary);
}
.cite-badge.badge-look {
  background: var(--lz-mostly-true);
  color: var(--lz-on-primary);
}
.cite-badge.badge-support {
  background: var(--lz-true);
  color: var(--lz-on-primary);
}
.cite-badge.badge-neutral {
  background: var(--lz-off);
  color: var(--lz-ink);
  border: 1px solid var(--lz-hair);
}
.cite-ref {
  font-size: 13px;
  color: var(--lz-primary);
  text-decoration: none;
  overflow-wrap: anywhere;
  padding: 0;
  min-height: 0;
}
