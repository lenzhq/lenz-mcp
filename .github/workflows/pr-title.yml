name: pr-title

# Squash merges take the pull request's title as the commit subject, so the
# title is checked the way a commit message would be: a conventional-commit type,
# an optional scope, and a lowercase subject.
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read

jobs:
  pr-title:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: amannn/action-semantic-pull-request@2252a14e810aa9b85c2d560bd7070c802206ecf6 # v6.1.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            refactor
            test
            ci
            build
            chore
            perf
            revert
          subjectPattern: ^[a-z].*$
          subjectPatternError: The subject "{subject}" must start with a lowercase letter.
